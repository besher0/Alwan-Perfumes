services:
  postgres:
    image: postgres:16-alpine
    container_name: alwan-postgres-dev
    environment:
      POSTGRES_DB: alwan
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - alwan_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d alwan"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  alwan_pg_data:
