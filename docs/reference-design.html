.sidebar::after{display:none;}
.brand{gap:9px;padding-inline:8px;}
.brand-icon{flex:0 0 42px;width:42px;height:42px;}
.brand h1{font-size:18px;line-height:1.45;letter-spacing:-.3px;overflow-wrap:normal;}
.brand small{font-size:8px;letter-spacing:1.2px;}
.nav-footer{display:none;}
/* Remove unwanted frosted/washed appearance: clearer tiles and labels. */
.card{background:#fffaf7;border:1px solid #f1e7e1;box-shadow:0 9px 28px rgba(60,38,30,.055);}
.note-card{background:#fffaf6;border:1px solid #e6d8cd;min-height:124px;padding:10px 8px 12px;gap:7px;box-shadow:0 2px 7px rgba(65,36,23,.025);}
.note-card img{display:block;height:77px;width:100%;max-width:110px;object-fit:contain;filter:none!important;mask-image:none!important;-webkit-mask-image:none!important;mix-blend-mode:normal!important;opacity:1!important;border-radius:8px;image-rendering:auto;}
.note-card strong{font-size:12px;font-weight:700;line-height:1.6;}
.note-card.selected{border:1.6px solid #a56d6e;background:#fdf3f0;box-shadow:inset 0 0 0 1px #e8bbb3;}
.favorite-grid{grid-template-columns:repeat(5,minmax(0,1fr));gap:11px;}
.favorite-grid .note-card{min-height:118px;padding-bottom:10px;}
.favorite-grid .note-card img{height:72px;max-width:105px;}
.notes-grid{gap:11px;}
.summary-chips{gap:8px;}
.summary-chip{padding:6px 8px;min-height:37px;gap:7px;white-space:nowrap;background:#fffaf7;border-color:#e6d8ce;font-size:10px;}
.summary-chip img{width:31px;height:30px;mix-blend-mode:normal!important;object-fit:contain;filter:none!important;border-radius:5px;}
.field label{font-size:11px;line-height:1.7;}
.field input,.field select,.field textarea{font-size:12px;min-height:43px;background:#fffdfa;}
.section-sub{font-size:11px;line-height:1.9;color:#887b72;}
.section-title{line-height:1.55;}
.section-top{flex-wrap:wrap;}
.head{flex-wrap:wrap;}
.head-title{min-width:0;}
.head p{line-height:1.85;}
.btn{white-space:normal;text-align:center;line-height:1.6;}
.crumb{flex-wrap:wrap;min-width:0;}
.summary-row{grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);}
.summary-row .value{overflow-wrap:anywhere;line-height:1.8;}
.purchase-form,.purchase-panel,.notes-panel,.summary-card{min-width:0;}
.fields>*{min-width:0;}
.overlay{backdrop-filter:none!important;-webkit-backdrop-filter:none!important;background:rgba(33,23,21,.62);}
/* Prevent note selection and long customer names colliding on mid-size tablets. */
@media(max-width:1270px){.brand h1{font-size:16px;}.brand-icon{flex-basis:37px;width:37px;height:37px;}.purchase-layout{gap:15px;}.notes-grid,.favorite-grid{gap:9px;}.note-card img{height:70px;}.favorite-grid .note-card img{height:67px;}}
@media(max-width:1050px){.purchase-layout{grid-template-columns:minmax(0,1fr);}.summary-card{position:static;}.notes-grid,.favorite-grid{grid-template-columns:repeat(5,minmax(0,1fr));}.summary-card .hero-image{min-height:225px;}}
@media(max-width:900px){.main::before{width:470px;height:156px;opacity:.50;}.notes-grid,.favorite-grid{grid-template-columns:repeat(4,minmax(0,1fr));}.fields{grid-template-columns:repeat(2,minmax(0,1fr));}.brand h1{font-size:16px;}.topbar{height:auto;min-height:40px;}.summary-card{grid-template-columns:190px minmax(0,1fr);}}
@media(max-width:710px){.main::before{display:none;}.sidebar{height:auto;min-height:0;}.sidebar::before{height:100%;opacity:.15;}.brand h1{font-size:14px;white-space:nowrap;}.brand-icon{flex:0 0 33px;width:33px;height:33px;}.nav button{flex-shrink:0;}.notes-grid,.favorite-grid{grid-template-columns:repeat(3,minmax(0,1fr));}.summary-card{display:block;}.fields.two{grid-template-columns:repeat(2,minmax(0,1fr));}.note-card{min-height:115px;}.favorite-grid .note-card{min-height:108px;}.note-card img{height:67px;}.favorite-grid .note-card img{height:62px;}.purchase-actions .btn{flex:1 1 160px;}}
@media(max-width:480px){.brand h1{font-size:13px;}.brand-icon{width:30px;height:30px;flex-basis:30px;}.sidebar{gap:4px;padding-inline:8px;}.nav{gap:0;}.nav button{width:35px;height:35px;min-height:35px;}.head h2{font-size:21px;}.notes-grid,.favorite-grid{gap:7px;}.note-card{min-height:108px;padding:6px 4px 8px;gap:3px;}.note-card img{height:58px;}.favorite-grid .note-card img{height:56px;}.field input,.field select{font-size:13px;}.fields{gap:9px;}.summary-card .hero-image{height:172px;}.summary-chip{min-height:33px;padding:4px 6px;}}

/* Responsive fix v3 — floral artwork stays visible on every page and viewport. */
html,body{max-width:100%;overflow-x:clip}
.app{width:100%;max-width:100%;min-width:0}
.main{min-width:0;width:auto;overflow-x:clip;overflow-y:visible;position:relative;isolation:isolate}
.main::before{display:block!important;position:absolute;top:0;left:0;right:auto;width:min(640px,70vw);max-width:none;height:210px;background-size:100% 100%;background-repeat:no-repeat;opacity:.78;z-index:0;pointer-events:none}
.main::after{content:'';position:absolute;left:0;bottom:0;width:min(310px,34vw);height:360px;pointer-events:none;background:radial-gradient(ellipse at 10% 70%,rgba(183,114,111,.085),transparent 72%);z-index:0}
.main>.topbar,.main>#app-content{position:relative;z-index:1;min-width:0}
#app-content,.home-cols,.profile-cols,.analytics-cols,.stats,.customer-grid,.mini-insights,.purchase-layout{min-width:0;max-width:100%}
.home-cols,.profile-cols,.analytics-cols{grid-template-columns:repeat(2,minmax(0,1fr))}
.home-cols>* ,.profile-cols>* ,.analytics-cols>* ,.stats>* ,.customer-grid>* ,.mini-insights>* ,.purchase-layout>*{min-width:0;max-width:100%}
.table-wrap{min-width:0;max-width:100%;overflow-x:auto;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}
.card{min-width:0}
.nav{min-width:0}
.topbar,.head,.section-top,.row-heading,.tool-row{min-width:0}
.section-title,.row-heading h3,.head h2,.person-line h3{overflow-wrap:anywhere}
.mobile-purchase{min-width:0}
@media(max-width:1050px){
.home-cols,.profile-cols,.analytics-cols{grid-template-columns:minmax(0,1fr)}
}
@media(max-width:900px){
 .main::before{width:min(460px,65vw);height:150px;opacity:.55}
}
@media(max-width:710px){
 .app{display:block}
 .main{width:100%;padding:18px 12px 38px;overflow-x:clip}
 .main::before{display:block!important;width:min(320px,82vw);height:116px;top:47px;left:-28px;opacity:.49;filter:none}
 .main::after{width:55vw;height:210px;opacity:.7}
 .sidebar{width:100%;min-width:0;max-width:100%;min-height:0;height:auto;position:sticky;top:0;z-index:20;gap:9px;padding:9px max(9px,env(safe-area-inset-right)) 9px max(9px,env(safe-area-inset-left));box-shadow:0 5px 17px rgba(46,30,25,.13)}
 .sidebar::before{height:100%;opacity:.11}
 .brand{gap:6px;min-width:0;flex-shrink:0}
 .brand h1{font-size:13px;white-space:nowrap}
 .brand-icon{flex:0 0 31px;width:31px;height:31px}
 .nav{margin-right:auto;display:flex;justify-content:flex-end;gap:3px;flex:1;min-width:0}
 .nav button{width:38px;height:38px;min-height:38px;flex:0 0 38px;padding:8px}
 .topbar{min-height:40px;margin-bottom:20px}
 .head,.heading-actions{min-width:0;max-width:100%}
 .head{margin-bottom:19px}
 .head h2{font-size:22px}
 .head p{font-size:11px;line-height:1.95}
 .eyebrow{font-size:9px;letter-spacing:1.2px}
 .home-cols,.profile-cols,.analytics-cols,.stats,.customer-grid,.mini-insights{max-width:100%}
 .home-cols,.profile-cols,.analytics-cols{grid-template-columns:minmax(0,1fr)}
 .tool-row{flex-wrap:wrap}
 .searchbox{max-width:100%;min-width:0}
 .card-content{padding:16px 14px}
 .table-wrap{display:none}
 .purchase-list-mobile{display:grid;gap:10px}
 .mobile-purchase{border:1px solid #e8dcd4;border-radius:14px;background:#fffdfb;padding:13px;display:grid;gap:9px}
 .mobile-purchase-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
 .mobile-purchase-top strong{font-size:13px;line-height:1.7}
 .mobile-purchase-top .stars-inline{font:17px Arial,sans-serif;color:#b88a4c;white-space:nowrap}
 .mobile-purchase-info{display:flex;gap:9px;justify-content:space-between;align-items:center;font-size:10px;color:#95877b}
 .mobile-purchase-note{display:flex;align-items:center;gap:6px;font-size:10px;color:#947d6e}
 .mobile-purchase-note svg{color:#b48a5a}
 .profile-hero,.hero-strip{overflow:hidden}
 .insight-select{flex-wrap:wrap;gap:12px}
 .insight-select select{width:100%;font-size:13px;min-height:40px}
 .record{flex-wrap:wrap}
 .record-actions{width:100%;justify-content:space-between}
 .bar-line{grid-template-columns:minmax(77px,30%) minmax(0,1fr) 40px;gap:6px}
 .dialog{max-width:100%;max-height:calc(100dvh - 24px);padding:18px}
 .overlay{padding:12px}
 .message-preview{overflow-wrap:anywhere;max-height:45dvh}
 .toast{max-width:calc(100vw - 24px);left:12px;bottom:max(12px,env(safe-area-inset-bottom));overflow-wrap:anywhere}
}
@media(max-width:400px){
 .sidebar{gap:5px;padding-left:6px;padding-right:6px}
 .brand h1{font-size:12px}
 .brand-icon{flex:0 0 27px;width:27px;height:27px;font-size:17px}
 .nav{gap:2px}
 .nav button{width:34px;height:35px;min-height:35px;flex-basis:34px;padding:6px}
 .nav button svg{width:18px;height:18px}
 .main::before{width:275px;height:110px;top:48px;left:-37px;opacity:.43}
 .main{padding-left:10px;padding-right:10px}
 .purchase-panel,.notes-panel{padding:14px 11px}
 .note-card img{max-width:90px}
 .customer-grid,.mini-insights{grid-template-columns:minmax(0,1fr)}
 .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
 .stat-card{padding:12px;min-height:105px}
 .stat-card strong{font-size:23px}
 .fields,.fields.two{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
 .field label{font-size:10px}
 .field input,.field select{padding-inline:8px;font-size:12px}
 .crumb{gap:5px;font-size:9px}
 .top-actions{gap:5px}
 .top-actions .action-icon{width:32px;height:32px}
 .purchase-actions{display:grid;grid-template-columns:minmax(0,1fr)}
 .purchase-actions .btn{width:100%;min-width:0}
}
@media(max-width:340px){
 .brand h1{font-size:11px}
 .brand-icon{display:none}
 .nav button{width:32px;flex-basis:32px}
 .fields,.fields.two{grid-template-columns:1fr}
 .notes-grid,.favorite-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
 .main::before{width:240px;height:96px;opacity:.35}
}

function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))};function $ (id){return document.getElementById(id)};function customer(id){return customers.find(c=>c.id===Number(id))};function own(id){return purchases.filter(p=>p.c===Number(id)).sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id)};function avg(arr){return arr.length?arr.reduce((s,p)=>s+p.stars,0)/arr.length:0};function phoneDisplay(v){return '+'+String(v||'').replace(/\D/g,'')};function sumByCustomer(c){const ps=own(c.id),stats=N.map(n=>{const list=ps.filter(p=>(p.notes?.length?p.notes:[p.primary]).includes(n.id));return {...n,count:list.length,avg:avg(list)}}).filter(n=>n.count);return{ps,byRate:[...stats].sort((a,b)=>b.avg-a.avg||b.count-a.count),byBought:[...stats].sort((a,b)=>b.count-a.count||b.avg-a.avg)}};

<section class="card purchase-panel"><div class="section-top"><div><h3 class="section-title">${icon('cart',21)} بيانات عملية الشراء</h3><p class="section-sub">أدخل تفاصيل العميل والعطر الذي تم شراؤه.</p></div></div>
<form id="purchase-form" novalidate><div class="fields two"><div class="field"><label for="purchase-customer">${icon('users',14)} اسم العميل <span class="required">*</span></label><select id="purchase-customer" required>${customers.map(x=>`<option value="${x.id}" ${form.customer===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label for="purchase-phone">${icon('phone',14)} رقم الهاتف</label><input id="purchase-phone" type="tel" readonly value="${c?phoneDisplay(c.phone):''}" dir="ltr" style="text-align:right;color:#8f7a6c"/></div></div>
<div class="fields" style="margin-top:16px"><div class="field"><label for="perfume-name">${icon('bottle',14)} اسم العطر <span class="required">*</span></label><input id="perfume-name" required maxlength="100" autocomplete="off" placeholder="مثال: عود ملكي" value="${esc(form.perfume)}"></div><div class="field"><label for="purchase-date">${icon('calendar',14)} تاريخ الشراء <span class="required">*</span></label><input type="date" id="purchase-date" value="${form.date}" required></div><div class="field"><label for="primary-note">${icon('flower',14)} النوتة الرئيسية <span class="required">*</span></label><select id="primary-note" required><option value="">حدد النوتة</option>${N.map(n=>`<option value="${n.id}" ${form.primary===n.id?'selected':''}>${n.name}</option>`).join('')}</select></div><div class="field"><label>${icon('star',14)} تقييم العميل <span class="required">*</span></label>${starControl()}</div></div></form>
</section>
<section class="card notes-panel"><div class="section-top"><div><h3 class="section-title">${icon('flower',22)} نوتات العطر</h3><p class="section-sub">اختر النوتات العطرية الموجودة في هذا العطر. يمكنك اختيار أكثر من نوتة.</p></div></div><div class="notes-grid">${N.map(n=>noteCard(n.id,'notes')).join('')}</div></section>
<section class="card notes-panel"><div class="section-top"><div><h3 class="section-title">${icon('heart',21)} النوتات المفضلة للعميل</h3><p class="section-sub">اختر النوتات التي يفضّلها العميل في عطورِه عادةً، وهي مستقلة عن تركيب العطر الحالي.</p></div></div><div class="favorite-grid">${N.map(n=>noteCard(n.id,'favorites')).join('')}</div></section>
<div class="purchase-actions">${btn('حفظ العملية','savePurchase','btn-gold','save')}${btn('إرسال ملخص للزبون','sendPurchase','btn-outline','send')}</div>
</div><aside class="card summary-card" aria-label="ملخص عملية الشراء"><img class="hero-image" src="${hero}" alt="زجاجة عطر فاخرة بجانب وردة وردية"><div class="summary-body" id="purchase-summary">${summaryHTML()}</div></aside></div>`}
function summaryChips(ids){return ids.length?`<div class="summary-chips">${ids.map(id=>{const n=note(id);return n?`<span class="summary-chip"><img alt="" src="${n.img}">${n.name}</span>`:''}).join('')}</div>`:`<span class="summary-placeholder">لم تُحدَّد نوتات بعد</span>`}
function summaryHTML(){let c=customer(form.customer);let vals=[['users','العميل',c?.name||'—'],['phone','رقم الهاتف',c?phoneDisplay(c.phone):'—'],['bottle','العطر',form.perfume||'لم يُكتب بعد'],['calendar','تاريخ الشراء',form.date?dayLabel(form.date):'—'],['flower','النوتة الرئيسية',form.primary?noteName(form.primary):'—'],['star','تقييم العميل',form.stars?`<span class="stars-inline">${'★'.repeat(form.stars)}${'☆'.repeat(5-form.stars)}</span>`:'لم يقيّم بعد']];return `<h3 class="section-title">${icon('list',19)} ملخص عملية الشراء</h3><p class="section-sub">مراجعة تفاصيل العملية قبل الحفظ.</p><div class="summary-rows">${vals.map(([i,label,val])=>`<div class="summary-row"><span class="summary-label">${icon(i,15)}${label}</span><span class="value">${val}</span></div>`).join('')}</div><h4 class="summary-note-title">${icon('flower',17)} نوتات العطر</h4>${summaryChips(form.notes)}<h4 class="summary-note-title">${icon('heart',17)} النوتات المفضلة للعميل</h4>${summaryChips(form.favorites)}`}
function updateSummary(){if($('purchase-summary'))$('purchase-summary').innerHTML=summaryHTML()}
function newPurchase(forCustomer){form={customer:customer(forCustomer)?Number(forCustomer):(customers[0]?.id||null),perfume:'',date:today(),primary:'',stars:0,notes:[],favorites:[...(customer(forCustomer)?.favorites||customer(customers[0]?.id)?.favorites||[])]};changePage('newPurchase')}
function finishPurchase(shareAfter=false){const perf=form.perfume.trim();if(!customer(form.customer)){notify('أضف عميلاً أولاً');return}if(!perf){notify('اكتب اسم العطر أولاً');$('perfume-name')?.focus();return}if(!form.date||!/^\d{4}-\d{2}-\d{2}$/.test(form.date)){notify('حدد تاريخ شراء صحيح');return}if(!form.primary){notify('اختر النوتة الرئيسية');$('primary-note')?.focus();return}if(!form.stars){notify('اختر تقييمًا من نجمة إلى خمس نجوم');return}if(!form.notes.includes(form.primary))form.notes.unshift(form.primary);purchases.unshift({id:Date.now(),c:Number(form.customer),perfume:perf,date:form.date,primary:form.primary,notes:[...new Set(form.notes)],stars:form.stars});customer(form.customer).favorites=[...form.favorites];currentCustomer=Number(form.customer);save();notify('تم حفظ عملية الشراء بنجاح');changePage('profile');if(shareAfter)shareDialog(customer(currentCustomer))}
function metrics(label,value,detail,ic){return `<div class="card stat-card"><div class="top"><span>${label}</span><span class="stat-icon">${icon(ic,17)}</span></div><strong>${value}</strong><small>${detail}</small></div>`}
function dashboard(){let one=customer(currentCustomer)||customers[0],s=one?sumByCustomer(one):{ps:[],byRate:[],byBought:[]};return `<section class="hero-strip"><div><span class="eyebrow">ALWAN / OVERVIEW</span><h3>عالم من العطور والذوق الرفيع</h3><p>كل عميل له ملفه، مشترياته، بصمته العطرية وتفضيلاته الخاصة.</p></div>${btn('تسجيل عملية شراء','newPurchase','btn-gold','plus')}</section>
<div class="stats">${metrics('إجمالي العملاء',customers.length,'ملفات عملاء في المتجر','users')}${metrics('إجمالي المشتريات',purchases.length,'عملية شراء مسجلة','cart')}${metrics('متوسط تقييم العطور',purchases.length?avg(purchases).toFixed(1)+' ★':'—','من أصل 5 نجوم','star')}${metrics('عملاء لديهم تفضيلات',customers.filter(c=>c.favorites?.length).length,'ملفات بذوق عطري محدد','heart')}</div>
<div class="home-cols"><section class="card card-content"><div class="row-heading"><h3>أحدث عمليات الشراء</h3><button class="inline-link" data-page="purchases">عرض الكل</button></div>${recentTable([...purchases].sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id).slice(0,4))}</section><section class="card card-content"><div class="row-heading"><h3>لمحة عن ذوق أحد العملاء</h3><button class="inline-link" data-action="viewInsights" data-customer="${one?.id||''}">تحليلات هذا العميل</button></div>${one?`<div class="spotlight"><div class="person-line"><div class="customer-letter">${esc(one.name[0])}</div><div><h3>${esc(one.name)}</h3><span class="muted" style="font-size:10px">${s.ps.length} عمليات شراء · متوسط التقييم ${s.ps.length?avg(s.ps).toFixed(1):'—'}</span></div></div><p class="muted" style="margin:20px 0 8px">النوتات المفضلة التي حدّدها الزبون:</p><div class="pills">${one.favorites.map(chip).join('')||'لم يحدد نوتات مفضلة'}</div><p class="muted" style="margin:17px 0 7px">الأكثر شراءً لديه: <b style="color:#764c33">${s.byBought[0]?.name||'—'}</b></p><button class="inline-link" data-open-customer="${one.id}">فتح ملف العميل ←</button></div>`:'<div class="empty">لا يوجد عملاء</div>'}</section></div>`}
function recentTable(rows){
 if(!rows.length) return '<div class="empty">لا توجد عمليات شراء بعد.</div>';
 const table=`<div class="table-wrap" tabindex="0" aria-label="جدول عمليات الشراء، يمكن التمرير أفقياً"><table class="data-table"><thead><tr><th>العميل</th><th>العطر</th><th>النوتة</th><th>التاريخ</th><th>التقييم</th></tr></thead><tbody>${rows.map(p=>`<tr><td><button class="table-link" data-open-customer="${p.c}">${esc(customer(p.c)?.name||'—')}</button></td><td><b>${esc(p.perfume)}</b></td><td>${noteName(p.primary)}</td><td>${dayLabel(p.date)}</td><td><span style="color:#b78846;white-space:nowrap;font:14px Arial" title="${p.stars}/5">${'★'.repeat(p.stars)}${'☆'.repeat(5-p.stars)}</span></td></tr>`).join('')}</tbody></table></div>`;
 const mobile=`<div class="purchase-list-mobile">${rows.map(p=>`<article class="mobile-purchase"><div class="mobile-purchase-top"><strong>${esc(p.perfume)}</strong><span class="stars-inline" aria-label="${p.stars} من خمس نجوم">${'★'.repeat(p.stars)}${'☆'.repeat(5-p.stars)}</span></div><div class="mobile-purchase-info"><button class="table-link" data-open-customer="${p.c}">${esc(customer(p.c)?.name||'—')}</button><span>${dayLabel(p.date)}</span></div><div class="mobile-purchase-note">${icon('flower',15)} النوتة الرئيسية: <b>${noteName(p.primary)}</b></div></article>`).join('')}</div>`;
 return table+mobile;
}
function customersPage(){let q=search.toLowerCase().trim(),rows=customers.filter(c=>c.name.toLowerCase().includes(q)||c.phone.includes(q.replace(/\D/g,'')));return head('CLIENTELLE / MEMBERS','العملاء','سجل لكل عميل مع مشترياته وتحليلات نوتاته العطرية.',btn('عميل جديد','addCustomer','btn-gold','plus'),'users')+`<div class="tool-row"><label class="searchbox">${icon('search',17)}<input placeholder="بحث بالاسم أو رقم الهاتف..." id="customer-search" value="${esc(search)}" autocomplete="off"/></label><span class="muted">${rows.length} عملاء</span></div><div class="customer-grid">${rows.map(c=>{let s=sumByCustomer(c);return `<button type="button" class="card customer-tile" data-open-customer="${c.id}"><div class="person-line"><div class="person-avatar">${esc(c.name[0])}</div><div><h3>${esc(c.name)}</h3><span class="phone">${phoneDisplay(c.phone)}</span></div></div><div class="tile-stats"><span>عمليات الشراء <b>${s.ps.length}</b></span><span>متوسط التقييم <b>${s.ps.length?avg(s.ps).toFixed(1)+' ★':'—'}</b></span><span>النوتة الأبرز <b>${s.byBought[0]?.name||'—'}</b></span></div><div class="pills">${c.favorites.slice(0,3).map(chip).join('')}</div><div class="tile-action">عرض الملف الشخصي ${icon('arrow',15)}</div></button>`}).join('')}</div>${rows.length?'':'<div class="empty">لا يوجد عملاء مطابقون للبحث</div>'}`}
function purchasesPage(){let q=search.toLowerCase().trim(),ps=[...purchases].filter(p=>p.perfume.toLowerCase().includes(q)||(customer(p.c)?.name||'').toLowerCase().includes(q)||p.notes.some(n=>noteName(n).includes(q))).sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);return head('PURCHASES / HISTORY','المشتريات','كل العمليات المسجلة وتقييماتها، مرتبطة بملفات العملاء.',btn('شراء جديد','newPurchase','btn-gold','plus'),'cart')+`<div class="tool-row"><label class="searchbox">${icon('search',17)}<input placeholder="اسم العميل، العطر أو النوتة..." id="purchase-search" value="${esc(search)}" autocomplete="off"/></label><span class="muted">${ps.length} عملية</span></div><section class="card card-content"><div class="row-heading"><h3>سجل المشتريات</h3></div>${recentTable(ps)}</section>`}
function recordList(ps){return ps.length?`<div class="records">${ps.map(p=>`<div class="record"><div><strong>${esc(p.perfume)}</strong><div><small>${dayLabel(p.date)} · النوتة الرئيسية: ${noteName(p.primary)}</small></div><div class="record-notes">${p.notes.map(chip).join('')}</div></div><div class="record-actions"><span class="stars-inline" title="${p.stars}/5" style="font-size:16px">${'★'.repeat(p.stars)}${'☆'.repeat(5-p.stars)}</span><button class="inline-link" data-action="shareOne" data-purchase="${p.id}">إرسال</button></div></div>`).join('')}</div>`:'<div class="empty">لم تسجّل عمليات شراء لهذا العميل.</div>'}
function barBlock(rows,kind){if(!rows.length)return `<div class="empty">التحليلات ستظهر بمجرد تسجيل عملية شراء وتقييمها.</div>`;let max=Math.max(...rows.map(x=>kind==='bought'?x.count:x.avg));return `<div class="bar-list">${rows.map(x=>`<div class="bar-line"><label><img alt="" src="${x.img}">${x.name}</label><div class="track"><div class="bar" style="width:${(kind==='bought'?x.count:x.avg)/max*100}%"></div></div><output>${kind==='bought'?x.count+' ×':x.avg.toFixed(1)+' ★'}</output></div>`).join('')}</div>`}
function profilePage(){const c=customer(currentCustomer)||customers[0];if(!c)return '<div class="empty">أضف عميلًا لبدء الاستخدام.</div>';const s=sumByCustomer(c);return head('CLIENT / PROFILE','ملف العميل','سجل المشتريات وتفضيلات الذوق العطري لهذا الزبون.',btn('شراء جديد','newForCurrent','btn-gold','plus'),'users')+`<section class="profile-hero"><div class="person-line"><span class="person-avatar">${esc(c.name[0])}</span><div><h3>${esc(c.name)}</h3><p>${phoneDisplay(c.phone)} · عميل منذ ${dayLabel(c.joined)}</p></div></div><div class="profile-metrics"><div><small>المشتريات</small><strong>${s.ps.length}</strong></div><div><small>متوسط التقييم</small><strong>${s.ps.length?avg(s.ps).toFixed(1)+' ★':'—'}</strong></div><div><small>الأكثر شراءً</small><strong>${s.byBought[0]?.name||'—'}</strong></div></div></section>
<div class="profile-actions">${btn('تحليلات ذوق هذا العميل','viewInsights','btn-pale','chart')}${btn('إرسال ملخص واتساب','shareCustomer','btn-outline','send')}${btn('تعديل النوتات المفضلة','editFavorites','btn-pale','heart')}</div>
<div class="profile-cols"><section class="card card-content"><div class="section-top"><div><h3 class="section-title">${icon('cart',19)} مشتريات الزبون</h3><p class="section-sub">تاريخ العطر والنوتات الموجودة فيه وتقييم العملية</p></div></div>${recordList(s.ps)}</section><section class="card card-content"><div class="section-top"><div><h3 class="section-title">${icon('flower',19)} بصمة الذوق العطري</h3><p class="section-sub">متوسط تقييم النجوم لكل نوتة في عطور هذا العميل</p></div></div>${barBlock(s.byRate.slice(0,6),'rated')}<div class="soft-divider"></div><div class="section-top" style="margin-bottom:10px"><div><h3 class="section-title">${icon('heart',17)} النوتات المفضلة</h3><p class="section-sub">اختيارات الزبون المباشرة</p></div></div><div class="pills">${c.favorites.length?c.favorites.map(chip).join(''):'<span class="muted">لم يحدد نوتات مفضلة بعد</span>'}</div><div class="soft-divider"></div><p class="section-sub">الأكثر شراءً: <strong style="color:#754e31">${s.byBought[0]?.name||'—'}</strong> ${s.byBought[0]?`(${s.byBought[0].count} عمليات)`:''}. احتساب التقييمات والشراء يشمل جميع النوتات المختارة في العطر.</p></section></div>`}
function insightsPage(){const c=customer(currentCustomer)||customers[0];if(!c)return '<div class="empty">لا يوجد عملاء بعد.</div>';const s=sumByCustomer(c);return head('TASTE / PERSONAL ANALYTICS','تحليلات الذوق','كل النتائج تخص العميل المختار فقط؛ دون دمج بيانات العملاء الآخرين.','','chart')+`<section class="card insight-select"><div><h3 class="section-title">${icon('users',19)} اختر العميل</h3><p class="section-sub">حدد أي زبون للاطلاع على بصمته العطرية</p></div><select id="insight-customer" aria-label="اختر العميل">${customers.map(x=>`<option value="${x.id}" ${x.id===c.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></section>
<div class="mini-insights"><section class="card"><small>عدد المشتريات</small><strong>${s.ps.length}</strong></section><section class="card"><small>النوتة الأكثر إعجاباً</small><div class="note-overview">${s.byRate[0]?`<img src="${s.byRate[0].img}" alt=""><strong>${s.byRate[0].name} (${s.byRate[0].avg.toFixed(1)} ★)</strong>`:'<strong>—</strong>'}</div></section><section class="card"><small>النوتة الأكثر شراءً</small><div class="note-overview">${s.byBought[0]?`<img src="${s.byBought[0].img}" alt=""><strong>${s.byBought[0].name} (${s.byBought[0].count} ×)</strong>`:'<strong>—</strong>'}</div></section></div>
<div class="analytics-cols"><section class="card card-content"><div class="section-top"><div><h3 class="section-title">${icon('star',21)} النوتات الأعلى تقييمًا</h3><p class="section-sub">متوسط عدد النجوم لكل نوتة تظهر في مشتريات هذا العميل</p></div></div>${barBlock(s.byRate,'rated')}</section><section class="card card-content"><div class="section-top"><div><h3 class="section-title">${icon('cart',21)} النوتات الأكثر شراءً</h3><p class="section-sub">عدد عمليات الشراء التي احتوت على كل نوتة</p></div></div>${barBlock(s.byBought,'bought')}</section></div><section class="card card-content" style="margin-top:16px"><div class="section-top"><div><h3 class="section-title">${icon('heart',20)} النوتات التي اختارها العميل كمفضّلة</h3><p class="section-sub">تفضيلات يذكرها الزبون بنفسه، مستقلة عن التقييمات وتكرار الشراء</p></div>${btn('إرسال ملخصه','shareCustomer','btn-pale','send')}</div><div class="pills">${c.favorites.length?c.favorites.map(chip).join(''):'<span class="muted">لا توجد تفضيلات مسجلة</span>'}</div></section>`}
function render(){renderNav();let names={dashboard:'الرئيسية',customers:'العملاء',purchases:'المشتريات',newPurchase:'شراء جديد',profile:'ملف العميل',insights:'تحليلات الذوق'};$('crumb').innerHTML=`<span>علوان للعطور</span><span class="slash">/</span><span>${page==='newPurchase'?'المشتريات':page==='profile'?'العملاء':''}</span><span class="slash">/</span><strong>${names[page]}</strong>`;$('top-date').innerHTML=icon('calendar',13)+' '+new Intl.DateTimeFormat('ar-SY',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(new Date());$('bell-icon').innerHTML=icon('bell',17);$('app-content').innerHTML=({dashboard,customers:customersPage,purchases:purchasesPage,newPurchase:purchasePage,profile:profilePage,insights:insightsPage}[page]||dashboard)()}
function changePage(p){page=p;search='';render();try{window.scrollTo({top:0,behavior:'auto'})}catch(_){window.scrollTo(0,0)}};function notify(msg){$('toast').textContent=msg;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),3100)}
function showDialog(title,desc,content,wide=false){$('dialog-root').innerHTML=`<div class="overlay" id="overlay"><section class="dialog ${wide?'wide':''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="dialog-head"><div><h3>${title}</h3><p>${desc}</p></div><button class="close" data-close="yes" aria-label="إغلاق">${icon('close',17)}</button></div>${content}</section></div>`};function closeDialog(){$('dialog-root').innerHTML=''};
function addCustomerDialog(){showDialog('إضافة عميل جديد','الزبون لا يحتاج تسجيل دخول، العامل ينشئ ملفه من التابلت.',`<form id="new-customer"><div class="field"><label for="new-name">اسم الزبون <span class="required">*</span></label><input id="new-name" required maxlength="90" placeholder="مثال: سارة الحسن" autocomplete="off"></div><div class="field"><label for="new-phone">رقم الهاتف <span class="required">*</span></label><input id="new-phone" required type="tel" inputmode="tel" placeholder="مثال: +963 944 238 117" dir="ltr" style="text-align:right"></div><p>رقم الهاتف ضروري لتجنب تكرار حساب العميل ولتحضير رسالة واتساب.</p><div class="dialog-actions">${btn('حفظ العميل','submitCustomer','btn-gold','save')}${btn('إلغاء','closeDialog','btn-pale','close')}</div></form>`)}
function addCustomer(){let name=$('new-name')?.value.trim(),phone=$('new-phone')?.value.replace(/\D/g,'');if(!name||name.length<2){notify('أدخل اسم زبون صحيح');return}if(!phone||phone.length<8||phone.length>15){notify('أدخل رقم هاتف صحيح (8 إلى 15 رقمًا)');return}let exists=customers.find(c=>c.phone===phone);if(exists){closeDialog();currentCustomer=exists.id;changePage('profile');notify('هذا الرقم موجود مسبقًا؛ تم فتح ملف العميل');return}let id=Math.max(0,...customers.map(c=>c.id))+1;customers.unshift({id,name,phone,joined:today(),favorites:[]});save();closeDialog();currentCustomer=id;newPurchase(id);notify('تم إنشاء ملف الزبون بنجاح')}
function buildMessage(c,purchasesToInclude){let s=sumByCustomer(c),ps=purchasesToInclude||s.ps;return `مرحباً ${c.name} 🌷\n\nهذا ملخص مشترياتك لدى علوان للعطور:\n\n${ps.length?ps.map((p,i)=>`${i+1}. العطر: ${p.perfume}\n   التاريخ: ${dayLabel(p.date)}\n   النوتة الرئيسية: ${noteName(p.primary)}\n   نوتات العطر: ${p.notes.map(noteName).join('، ')}\n   تقييمك: ${'★'.repeat(p.stars)}${'☆'.repeat(5-p.stars)} (${p.stars}/5)`).join('\n\n'):'لا توجد مشتريات مسجلة.'}\n\nبصمة ذوقك العطري:\n• النوتات المفضلة: ${c.favorites.map(noteName).join('، ')||'لم تُحدَّد بعد'}\n• الأعلى تقييمًا: ${s.byRate[0]?`${s.byRate[0].name} (${s.byRate[0].avg.toFixed(1)}/5)`:'—'}\n• الأكثر شراءً: ${s.byBought[0]?`${s.byBought[0].name} (${s.byBought[0].count} عمليات)`:'—'}\n\nشكرًا لثقتك بنا ✨`}
let shareData={customerId:1,text:''};function shareDialog(c,onePurchase){if(!c)return;shareData={customerId:c.id,text:buildMessage(c,onePurchase?[onePurchase]:null)};showDialog('ملخص الزبون للمشاركة','يمكنك نسخ الرسالة أو فتح واتساب وإرسالها يدويًا.',`<div class="message-preview" id="share-text">${esc(shareData.text)}</div><div class="dialog-actions">${btn('فتح واتساب','openWhatsApp','btn-gold','send')}${btn('نسخ الرسالة','copyMessage','btn-pale','copy')}${btn('إغلاق','closeDialog','btn-outline','close')}</div><p>المعاينة فقط؛ لن تُرسل الرسالة تلقائيًا. في واتساب راجعها ثم اضغط إرسال.</p>`,true)}
function editFavoritesDialog(){let c=customer(currentCustomer);if(!c)return;showDialog('تعديل النوتات المفضلة','اختر النوتات التي يذكر العميل أنه يحبها، بعيدًا عن نوتات مشترياته.',`<div class="favorite-grid" id="edit-favs">${N.map(n=>`<button class="note-card ${c.favorites.includes(n.id)?'selected':''}" data-edit-note="${n.id}" aria-pressed="${c.favorites.includes(n.id)}"><span class="mark">${icon('check',12)}</span><img src="${n.img}" alt=""><strong>${n.name}</strong></button>`).join('')}</div><div class="dialog-actions">${btn('حفظ التفضيلات','saveFavorites','btn-gold','save')}${btn('إلغاء','closeDialog','btn-pale','close')}</div>`,true);editSelection=[...c.favorites]};let editSelection=[];
document.addEventListener('click',e=>{if(e.target.id==='overlay'){closeDialog();return}const t=e.target.closest('[data-page],[data-action],[data-open-customer],[data-note],[data-stars],[data-close],[data-edit-note]');if(!t)return;if(t.dataset.close){closeDialog();return}if(t.dataset.page){changePage(t.dataset.page);return}if(t.dataset.openCustomer){currentCustomer=Number(t.dataset.openCustomer);changePage('profile');return}if(t.dataset.stars){form.stars=Number(t.dataset.stars);$('rating-picker').outerHTML=starControl();updateSummary();return}if(t.dataset.note){let key=t.dataset.section==='notes'?'notes':'favorites',id=t.dataset.note;form[key]=form[key].includes(id)?form[key].filter(n=>n!==id):[...form[key],id];t.classList.toggle('selected',form[key].includes(id));t.setAttribute('aria-pressed',String(form[key].includes(id)));updateSummary();return}if(t.dataset.editNote){let id=t.dataset.editNote;editSelection=editSelection.includes(id)?editSelection.filter(x=>x!==id):[...editSelection,id];t.classList.toggle('selected',editSelection.includes(id));t.setAttribute('aria-pressed',String(editSelection.includes(id)));return}let act=t.dataset.action;if(!act)return;switch(act){case 'newPurchase':newPurchase(currentCustomer);break;case 'newForCurrent':newPurchase(currentCustomer);break;case 'addCustomer':addCustomerDialog();break;case 'submitCustomer':addCustomer();break;case 'savePurchase':finishPurchase();break;case 'sendPurchase':finishPurchase(true);break;case 'viewInsights':if(t.dataset.customer)currentCustomer=Number(t.dataset.customer);changePage('insights');break;case 'shareCustomer':shareDialog(customer(currentCustomer));break;case 'shareOne':{let p=purchases.find(x=>String(x.id)===String(t.dataset.purchase));if(p)shareDialog(customer(p.c),p);break}case 'closeDialog':closeDialog();break;case 'copyMessage':{const msg=shareData.text;if(navigator.clipboard?.writeText)navigator.clipboard.writeText(msg).then(()=>notify('تم نسخ الرسالة')).catch(()=>fallbackCopy(msg));else fallbackCopy(msg);break}case 'openWhatsApp':{let c=customer(shareData.customerId);if(c){window.open('https://wa.me/'+c.phone+'?text='+encodeURIComponent(shareData.text),'_blank','noopener,noreferrer');notify('تم فتح واتساب، أرسل الرسالة بعد مراجعتها')}break}case 'editFavorites':editFavoritesDialog();break;case 'saveFavorites':{let c=customer(currentCustomer);if(c){c.favorites=[...editSelection];save();closeDialog();render();notify('تم تحديث تفضيلات العميل')}break}}});
function fallbackCopy(msg){let ta=document.createElement('textarea');ta.value=msg;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');notify('تم نسخ الرسالة')}catch(e){notify('يمكنك تحديد نص الرسالة ونسخه يدويًا')}ta.remove()}
document.addEventListener('input',e=>{const id=e.target.id;if(id==='perfume-name'){form.perfume=e.target.value;updateSummary()}else if(id==='purchase-date'){form.date=e.target.value;updateSummary()}else if(id==='customer-search'||id==='purchase-search'){let el=e.target,idx=el.selectionStart;search=el.value;render();const replacement=$(id);if(replacement){replacement.focus();replacement.setSelectionRange(idx,idx)}}});
document.addEventListener('change',e=>{let id=e.target.id;if(id==='purchase-customer'){form.customer=Number(e.target.value);form.favorites=[...(customer(form.customer)?.favorites||[])];render()}else if(id==='primary-note'){form.primary=e.target.value;if(form.primary&&!form.notes.includes(form.primary))form.notes.push(form.primary);render()}else if(id==='insight-customer'){currentCustomer=Number(e.target.value);render()}else if(id==='purchase-date'){form.date=e.target.value;updateSummary()}});
document.addEventListener('submit',e=>{if(e.target.id==='new-customer'){e.preventDefault();addCustomer()}if(e.target.id==='purchase-form'){e.preventDefault();finishPurchase()}});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDialog()});
// Showcase starts on the redesigned purchase screen so the new visual note cards are immediately visible.
render();
})();
</script>
</body>
</html>
